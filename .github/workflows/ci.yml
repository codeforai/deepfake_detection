name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests and benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Install Python packages
        run: pip install -r requirements-dev.txt

      - name: Run API tests
        run: pytest -v tests/

      # Fails the build if the deployed model drops below 80% accuracy on the
      # sample clips, or its p95 inference time goes above 250 ms
      - name: Benchmark deployed model
        run: python benchmarks/benchmark.py --min-accuracy 80 --max-latency-ms 250 --out benchmark-results.json

      - name: Save benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json
          if-no-files-found: ignore

  docker:
    name: Docker build and smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t voice-detection .

      - name: Start container
        run: docker run -d --name api -p 8000:8000 -e API_KEY=ci-key voice-detection

      - name: Wait for health check
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health; then echo; exit 0; fi
            sleep 2
          done
          echo "Service did not become healthy in 120 s"
          exit 1

      - name: Smoke test the API
        run: |
          set -e
          curl -sf http://localhost:8000/health | grep -q '"model_loaded":true'

          B64=$(base64 -w0 tests/samples/spoof/Telugu_Voice_AI_GENERATED.mp3)
          echo "{\"language\":\"Telugu\",\"audioFormat\":\"mp3\",\"audioBase64\":\"$B64\"}" > body.json

          echo "Request without API key should be rejected:"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/api/voice-detection \
            -H 'Content-Type: application/json' -d @body.json)
          echo "  HTTP $code"
          test "$code" = "401"

          echo "Request with API key should be classified:"
          curl -sf -X POST http://localhost:8000/api/voice-detection \
            -H 'Content-Type: application/json' -H 'x-api-key: ci-key' -d @body.json | tee response.json
          echo
          grep -q '"status":"success"' response.json

      - name: Container logs
        if: always()
        run: docker logs api
